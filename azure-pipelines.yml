name: opsledger-validation-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: manualRepository
    displayName: Existing artifact GitHub repository
    type: string
    default: GokulaKrishnanRGK/dotnet-ado-test-automation-pipeline
  - name: manualBranch
    displayName: Existing artifact branch
    type: string
    default: main
  - name: manualCommitSha
    displayName: Existing artifact commit SHA
    type: string
    default: ""
  - name: manualGithubRunId
    displayName: Existing artifact GitHub run id
    type: string
    default: ""
  - name: manualGithubRunAttempt
    displayName: Existing artifact GitHub run attempt
    type: string
    default: "1"
  - name: manualArtifactSource
    displayName: Existing artifact source
    type: string
    default: "github-actions"

resources:
  webhooks:
    - webhook: WebHook
      connection: OpsLedger-GitHub-IncomingWebhook

variables:
  - group: OpsLedger.Validation
  - name: OPSLEDGER_API_BASE_ADDRESS
    value: http://localhost:5184
  - name: OPSLEDGER_ARTIFACT_DOWNLOAD_ROOT
    value: $(Pipeline.Workspace)\opsledger-artifacts
  - name: OPSLEDGER_COVERAGE_ARTIFACT_NAME
    value: opsledger-coverage-report
  - name: OPSLEDGER_COVERAGE_DOWNLOAD_ROOT
    value: $(Pipeline.Workspace)\opsledger-coverage
  - name: OPSLEDGER_GITHUB_TEST_RESULTS_ARTIFACT_NAME
    value: opsledger-test-results
  - name: OPSLEDGER_GITHUB_TEST_RESULTS_DOWNLOAD_ROOT
    value: $(Pipeline.Workspace)\opsledger-github-test-results
  - name: OPSLEDGER_TEST_RESULTS_ROOT
    value: $(Agent.TempDirectory)\opsledger-test-results
  - name: USE_LOCAL_POSTGRESQL
    value: true

stages:
  - stage: ReceiveGitHubArtifactMetadata
    displayName: Receive GitHub artifact metadata
    jobs:
      - job: PrintReceivedMetadata
        displayName: Print received GitHub metadata
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - pwsh: |
              Set-StrictMode -Version Latest
              $ErrorActionPreference = "Stop"

              [string]$buildReason = $env:BUILD_REASON
              function Get-ManualArtifactName {
                  if ([string]::IsNullOrWhiteSpace($env:OPSLEDGER_MANUAL_COMMIT_SHA)) {
                      return ""
                  }

                  [int]$shortShaLength = [System.Math]::Min(12, $env:OPSLEDGER_MANUAL_COMMIT_SHA.Length)
                  return "opsledger-app-win-x64-$($env:OPSLEDGER_MANUAL_COMMIT_SHA.Substring(0, $shortShaLength))"
              }

              function Get-ManualGithubRunUrl {
                  if ([string]::IsNullOrWhiteSpace($env:OPSLEDGER_MANUAL_REPOSITORY) -or [string]::IsNullOrWhiteSpace($env:OPSLEDGER_MANUAL_GITHUB_RUN_ID)) {
                      return ""
                  }

                  return "https://github.com/$($env:OPSLEDGER_MANUAL_REPOSITORY)/actions/runs/$($env:OPSLEDGER_MANUAL_GITHUB_RUN_ID)"
              }

              [System.Collections.Specialized.OrderedDictionary]$receivedMetadata = [ordered]@{
                  SchemaVersion = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_SCHEMA_VERSION } else { "1" }
                  Repository = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_REPOSITORY } else { $env:OPSLEDGER_MANUAL_REPOSITORY }
                  Branch = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_BRANCH } else { $env:OPSLEDGER_MANUAL_BRANCH }
                  CommitSha = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_COMMIT_SHA } else { $env:OPSLEDGER_MANUAL_COMMIT_SHA }
                  GithubRunId = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_GITHUB_RUN_ID } else { $env:OPSLEDGER_MANUAL_GITHUB_RUN_ID }
                  GithubRunAttempt = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_GITHUB_RUN_ATTEMPT } else { $env:OPSLEDGER_MANUAL_GITHUB_RUN_ATTEMPT }
                  GithubRunUrl = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_GITHUB_RUN_URL } else { Get-ManualGithubRunUrl }
                  ArtifactName = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_ARTIFACT_NAME } else { Get-ManualArtifactName }
                  ArtifactSource = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_ARTIFACT_SOURCE } else { $env:OPSLEDGER_MANUAL_ARTIFACT_SOURCE }
              }

              Write-Host "Build reason: $buildReason"

              if ($buildReason -ne "ResourceTrigger" -and [string]::IsNullOrWhiteSpace([string]$receivedMetadata["CommitSha"])) {
                  Write-Host "No existing artifact metadata was provided. This run can register or validate the webhook-enabled pipeline definition."
                  return
              }

              [string[]]$missingFields = @($receivedMetadata.GetEnumerator() |
                  Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } |
                  ForEach-Object { [string]$_.Key })

              if ($missingFields.Count -gt 0) {
                  throw "Webhook payload is missing required field(s): $($missingFields -join ', ')."
              }

              Write-Host "Repository: $($receivedMetadata["Repository"])"
              Write-Host "Branch: $($receivedMetadata["Branch"])"
              Write-Host "Commit SHA: $($receivedMetadata["CommitSha"])"
              Write-Host "GitHub run id: $($receivedMetadata["GithubRunId"])"
              Write-Host "GitHub run attempt: $($receivedMetadata["GithubRunAttempt"])"
              Write-Host "GitHub run URL: $($receivedMetadata["GithubRunUrl"])"
              Write-Host "Artifact name: $($receivedMetadata["ArtifactName"])"
              Write-Host "Artifact source: $($receivedMetadata["ArtifactSource"])"
            displayName: Validate received GitHub metadata
            env:
              BUILD_REASON: $(Build.Reason)
              OPSLEDGER_WEBHOOK_SCHEMA_VERSION: ${{ parameters.WebHook.resource.message.schemaVersion }}
              OPSLEDGER_WEBHOOK_REPOSITORY: ${{ parameters.WebHook.resource.message.repository }}
              OPSLEDGER_WEBHOOK_BRANCH: ${{ parameters.WebHook.resource.message.branch }}
              OPSLEDGER_WEBHOOK_COMMIT_SHA: ${{ parameters.WebHook.resource.message.commitSha }}
              OPSLEDGER_WEBHOOK_GITHUB_RUN_ID: ${{ parameters.WebHook.resource.message.githubRunId }}
              OPSLEDGER_WEBHOOK_GITHUB_RUN_ATTEMPT: ${{ parameters.WebHook.resource.message.githubRunAttempt }}
              OPSLEDGER_WEBHOOK_GITHUB_RUN_URL: ${{ parameters.WebHook.resource.message.githubRunUrl }}
              OPSLEDGER_WEBHOOK_ARTIFACT_NAME: ${{ parameters.WebHook.resource.message.artifactName }}
              OPSLEDGER_WEBHOOK_ARTIFACT_SOURCE: ${{ parameters.WebHook.resource.message.artifactSource }}
              OPSLEDGER_MANUAL_REPOSITORY: ${{ parameters.manualRepository }}
              OPSLEDGER_MANUAL_BRANCH: ${{ parameters.manualBranch }}
              OPSLEDGER_MANUAL_COMMIT_SHA: ${{ parameters.manualCommitSha }}
              OPSLEDGER_MANUAL_GITHUB_RUN_ID: ${{ parameters.manualGithubRunId }}
              OPSLEDGER_MANUAL_GITHUB_RUN_ATTEMPT: ${{ parameters.manualGithubRunAttempt }}
              OPSLEDGER_MANUAL_ARTIFACT_SOURCE: ${{ parameters.manualArtifactSource }}

  - stage: ValidateArtifact
    displayName: Validate published artifact
    dependsOn: ReceiveGitHubArtifactMetadata
    condition: or(eq(variables['Build.Reason'], 'ResourceTrigger'), ne('${{ parameters.manualCommitSha }}', ''))
    jobs:
      - job: RunBddValidation
        displayName: Run BDD validation
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: 10.0.x

          - pwsh: dotnet --info
            displayName: Print .NET information

          - pwsh: |
              Set-StrictMode -Version Latest
              $ErrorActionPreference = "Stop"

              [string]$buildReason = $env:BUILD_REASON
              function Get-ManualArtifactName {
                  if ([string]::IsNullOrWhiteSpace($env:OPSLEDGER_MANUAL_COMMIT_SHA)) {
                      return ""
                  }

                  [int]$shortShaLength = [System.Math]::Min(12, $env:OPSLEDGER_MANUAL_COMMIT_SHA.Length)
                  return "opsledger-app-win-x64-$($env:OPSLEDGER_MANUAL_COMMIT_SHA.Substring(0, $shortShaLength))"
              }

              function Get-ManualGithubRunUrl {
                  if ([string]::IsNullOrWhiteSpace($env:OPSLEDGER_MANUAL_REPOSITORY) -or [string]::IsNullOrWhiteSpace($env:OPSLEDGER_MANUAL_GITHUB_RUN_ID)) {
                      return ""
                  }

                  return "https://github.com/$($env:OPSLEDGER_MANUAL_REPOSITORY)/actions/runs/$($env:OPSLEDGER_MANUAL_GITHUB_RUN_ID)"
              }

              [System.Collections.Specialized.OrderedDictionary]$metadata = [ordered]@{
                  Repository = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_REPOSITORY } else { $env:OPSLEDGER_MANUAL_REPOSITORY }
                  Branch = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_BRANCH } else { $env:OPSLEDGER_MANUAL_BRANCH }
                  CommitSha = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_COMMIT_SHA } else { $env:OPSLEDGER_MANUAL_COMMIT_SHA }
                  GithubRunId = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_GITHUB_RUN_ID } else { $env:OPSLEDGER_MANUAL_GITHUB_RUN_ID }
                  GithubRunAttempt = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_GITHUB_RUN_ATTEMPT } else { $env:OPSLEDGER_MANUAL_GITHUB_RUN_ATTEMPT }
                  GithubRunUrl = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_GITHUB_RUN_URL } else { Get-ManualGithubRunUrl }
                  ArtifactName = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_ARTIFACT_NAME } else { Get-ManualArtifactName }
                  ArtifactSource = if ($buildReason -eq "ResourceTrigger") { $env:OPSLEDGER_WEBHOOK_ARTIFACT_SOURCE } else { $env:OPSLEDGER_MANUAL_ARTIFACT_SOURCE }
              }

              [string[]]$missingFields = @($metadata.GetEnumerator() |
                  Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } |
                  ForEach-Object { [string]$_.Key })

              if ($missingFields.Count -gt 0) {
                  throw "Artifact metadata is missing required field(s): $($missingFields -join ', ')."
              }

              Write-Host "##vso[task.setvariable variable=GITHUB_REPOSITORY]$($metadata["Repository"])"
              Write-Host "##vso[task.setvariable variable=GITHUB_BRANCH]$($metadata["Branch"])"
              Write-Host "##vso[task.setvariable variable=GITHUB_COMMIT_SHA]$($metadata["CommitSha"])"
              Write-Host "##vso[task.setvariable variable=GITHUB_RUN_ID]$($metadata["GithubRunId"])"
              Write-Host "##vso[task.setvariable variable=GITHUB_RUN_ATTEMPT]$($metadata["GithubRunAttempt"])"
              Write-Host "##vso[task.setvariable variable=GITHUB_RUN_URL]$($metadata["GithubRunUrl"])"
              Write-Host "##vso[task.setvariable variable=GITHUB_ARTIFACT_NAME]$($metadata["ArtifactName"])"
              Write-Host "##vso[task.setvariable variable=GITHUB_ARTIFACT_SOURCE]$($metadata["ArtifactSource"])"

              Write-Host "Using artifact '$($metadata["ArtifactName"])' from GitHub run '$($metadata["GithubRunId"])'."
            displayName: Resolve artifact metadata
            env:
              BUILD_REASON: $(Build.Reason)
              OPSLEDGER_WEBHOOK_REPOSITORY: ${{ parameters.WebHook.resource.message.repository }}
              OPSLEDGER_WEBHOOK_BRANCH: ${{ parameters.WebHook.resource.message.branch }}
              OPSLEDGER_WEBHOOK_COMMIT_SHA: ${{ parameters.WebHook.resource.message.commitSha }}
              OPSLEDGER_WEBHOOK_GITHUB_RUN_ID: ${{ parameters.WebHook.resource.message.githubRunId }}
              OPSLEDGER_WEBHOOK_GITHUB_RUN_ATTEMPT: ${{ parameters.WebHook.resource.message.githubRunAttempt }}
              OPSLEDGER_WEBHOOK_GITHUB_RUN_URL: ${{ parameters.WebHook.resource.message.githubRunUrl }}
              OPSLEDGER_WEBHOOK_ARTIFACT_NAME: ${{ parameters.WebHook.resource.message.artifactName }}
              OPSLEDGER_WEBHOOK_ARTIFACT_SOURCE: ${{ parameters.WebHook.resource.message.artifactSource }}
              OPSLEDGER_MANUAL_REPOSITORY: ${{ parameters.manualRepository }}
              OPSLEDGER_MANUAL_BRANCH: ${{ parameters.manualBranch }}
              OPSLEDGER_MANUAL_COMMIT_SHA: ${{ parameters.manualCommitSha }}
              OPSLEDGER_MANUAL_GITHUB_RUN_ID: ${{ parameters.manualGithubRunId }}
              OPSLEDGER_MANUAL_GITHUB_RUN_ATTEMPT: ${{ parameters.manualGithubRunAttempt }}
              OPSLEDGER_MANUAL_ARTIFACT_SOURCE: ${{ parameters.manualArtifactSource }}

          - pwsh: |
              New-Item -ItemType Directory -Path "$(OPSLEDGER_ARTIFACT_DOWNLOAD_ROOT)" -Force | Out-Null
              New-Item -ItemType Directory -Path "$(OPSLEDGER_COVERAGE_DOWNLOAD_ROOT)" -Force | Out-Null
              New-Item -ItemType Directory -Path "$(OPSLEDGER_GITHUB_TEST_RESULTS_DOWNLOAD_ROOT)" -Force | Out-Null
              New-Item -ItemType Directory -Path "$(OPSLEDGER_TEST_RESULTS_ROOT)" -Force | Out-Null
              New-Item -ItemType Directory -Path "$(Pipeline.Workspace)\opsledger-logs" -Force | Out-Null
            displayName: Prepare workspace directories

          - pwsh: |
              [hashtable]$downloadArguments = @{
                Repository = "$(GITHUB_REPOSITORY)"
                RunId = "$(GITHUB_RUN_ID)"
                ArtifactName = "$(GITHUB_ARTIFACT_NAME)"
                Token = "$(GITHUB_ARTIFACT_TOKEN)"
                OutputRoot = "$(OPSLEDGER_ARTIFACT_DOWNLOAD_ROOT)"
                SetAzurePipelineVariables = $true
              }

              ./scripts/Get-GitHubActionsArtifact.ps1 @downloadArguments
            displayName: Download GitHub Actions artifact

          - pwsh: |
              [hashtable]$downloadArguments = @{
                Repository = "$(GITHUB_REPOSITORY)"
                RunId = "$(GITHUB_RUN_ID)"
                ArtifactName = "$(OPSLEDGER_COVERAGE_ARTIFACT_NAME)"
                Token = "$(GITHUB_ARTIFACT_TOKEN)"
                OutputRoot = "$(OPSLEDGER_COVERAGE_DOWNLOAD_ROOT)"
                ArtifactPathVariableName = "OPSLEDGER_DOWNLOADED_COVERAGE_PATH"
                SetAzurePipelineVariables = $true
                AllowAnyContent = $true
              }

              ./scripts/Get-GitHubActionsArtifact.ps1 @downloadArguments
            displayName: Download GitHub Actions coverage report

          - pwsh: |
              [hashtable]$downloadArguments = @{
                Repository = "$(GITHUB_REPOSITORY)"
                RunId = "$(GITHUB_RUN_ID)"
                ArtifactName = "$(OPSLEDGER_GITHUB_TEST_RESULTS_ARTIFACT_NAME)"
                Token = "$(GITHUB_ARTIFACT_TOKEN)"
                OutputRoot = "$(OPSLEDGER_GITHUB_TEST_RESULTS_DOWNLOAD_ROOT)"
                ArtifactPathVariableName = "OPSLEDGER_DOWNLOADED_GITHUB_TEST_RESULTS_PATH"
                SetAzurePipelineVariables = $true
                AllowAnyContent = $true
              }

              ./scripts/Get-GitHubActionsArtifact.ps1 @downloadArguments
            displayName: Download GitHub Actions test results

          - task: PublishTestResults@2
            displayName: Publish GitHub CI test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**\*.trx'
              searchFolder: $(OPSLEDGER_DOWNLOADED_GITHUB_TEST_RESULTS_PATH)
              failTaskOnFailedTests: true
              testRunTitle: OpsLedger GitHub CI validation

          - pwsh: |
              [string]$coverageSummaryPath = Join-Path "$(OPSLEDGER_DOWNLOADED_COVERAGE_PATH)" "Cobertura.xml"
              [string]$coverageHtmlPath = Join-Path "$(OPSLEDGER_DOWNLOADED_COVERAGE_PATH)" "index.html"

              if (-not (Test-Path -LiteralPath $coverageSummaryPath -PathType Leaf)) {
                Get-ChildItem -LiteralPath "$(OPSLEDGER_DOWNLOADED_COVERAGE_PATH)" -Recurse | Select-Object -ExpandProperty FullName
                throw "Coverage summary file was not found at '$coverageSummaryPath'."
              }

              if (-not (Test-Path -LiteralPath $coverageHtmlPath -PathType Leaf)) {
                Get-ChildItem -LiteralPath "$(OPSLEDGER_DOWNLOADED_COVERAGE_PATH)" -Recurse | Select-Object -ExpandProperty FullName
                throw "Coverage HTML entry point was not found at '$coverageHtmlPath'."
              }

              Write-Host "Coverage summary: $coverageSummaryPath"
              Write-Host "Coverage HTML: $coverageHtmlPath"
            displayName: Verify downloaded coverage report

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            inputs:
              summaryFileLocation: $(OPSLEDGER_DOWNLOADED_COVERAGE_PATH)\Cobertura.xml
              pathToSources: $(Build.SourcesDirectory)
              failIfCoverageEmpty: true

          - pwsh: |
              [hashtable]$postgresArguments = @{
                SetAzurePipelineVariables = $true
              }

              ./scripts/install-postgresql.ps1 @postgresArguments
            displayName: Install and prepare PostgreSQL
            condition: and(succeeded(), eq(variables['USE_LOCAL_POSTGRESQL'], 'true'))

          - pwsh: |
              [hashtable]$setupArguments = @{
                ApiBaseAddress = "$(OPSLEDGER_API_BASE_ADDRESS)"
                StorageProvider = "PostgreSql"
                LogDirectory = "$(Pipeline.Workspace)\opsledger-logs"
                MetadataPath = "$(Pipeline.Workspace)\opsledger-test-env.json"
              }

              ./scripts/setup-test-env.ps1 @setupArguments
            displayName: Prepare validation environment
            env:
              OPSLEDGER_CONNECTION_STRING: $(OPSLEDGER_CONNECTION_STRING)

          - pwsh: |
              [hashtable]$bddArguments = @{
                ArtifactPath = "$(OPSLEDGER_DOWNLOADED_ARTIFACT_PATH)"
                Configuration = "Release"
                ResultsRoot = "$(OPSLEDGER_TEST_RESULTS_ROOT)\bdd-api"
                TestFilter = "Category!=ui"
              }

              [System.Management.Automation.CommandInfo]$bddRunner = Get-Command ./scripts/Run-BddAgainstArtifact.ps1
              Write-Host "Using BDD runner: $($bddRunner.Source)"
              Write-Host "BDD runner parameters: $($bddRunner.Parameters.Keys -join ', ')"

              ./scripts/Run-BddAgainstArtifact.ps1 @bddArguments
            displayName: Run API and workflow BDD scenarios
            continueOnError: true
            env:
              OPSLEDGER_API_BASE_ADDRESS: $(OPSLEDGER_API_BASE_ADDRESS)

          - pwsh: |
              [hashtable]$bddArguments = @{
                ArtifactPath = "$(OPSLEDGER_DOWNLOADED_ARTIFACT_PATH)"
                Configuration = "Release"
                ResultsRoot = "$(OPSLEDGER_TEST_RESULTS_ROOT)\bdd-ui"
                TestFilter = "Category=ui&Category!=workitem"
                IncludeUi = $true
              }

              [System.Management.Automation.CommandInfo]$bddRunner = Get-Command ./scripts/Run-BddAgainstArtifact.ps1
              Write-Host "Using BDD runner: $($bddRunner.Source)"
              Write-Host "BDD runner parameters: $($bddRunner.Parameters.Keys -join ', ')"

              ./scripts/Run-BddAgainstArtifact.ps1 @bddArguments
            displayName: Run interactive UI BDD scenarios
            condition: and(succeededOrFailed(), eq(variables['RUN_INTERACTIVE_UI_BDD'], 'true'))
            continueOnError: true
            env:
              OPSLEDGER_API_BASE_ADDRESS: $(OPSLEDGER_API_BASE_ADDRESS)

          - pwsh: |
              [hashtable]$bddArguments = @{
                ArtifactPath = "$(OPSLEDGER_DOWNLOADED_ARTIFACT_PATH)"
                Configuration = "Release"
                ResultsRoot = "$(OPSLEDGER_TEST_RESULTS_ROOT)\bdd-workitem"
                TestFilter = "Category=workitem"
                IncludeUi = $true
              }

              [System.Management.Automation.CommandInfo]$bddRunner = Get-Command ./scripts/Run-BddAgainstArtifact.ps1
              Write-Host "Using BDD runner: $($bddRunner.Source)"
              Write-Host "BDD runner parameters: $($bddRunner.Parameters.Keys -join ', ')"

              ./scripts/Run-BddAgainstArtifact.ps1 @bddArguments
            displayName: Run failed UI BDD scenarios for work item verification
            condition: and(succeededOrFailed(), eq(variables['RUN_INTERACTIVE_UI_BDD'], 'true'), eq(variables['RUN_WORK_ITEM_FAILURE_BDD'], 'true'))
            continueOnError: true
            env:
              OPSLEDGER_API_BASE_ADDRESS: $(OPSLEDGER_API_BASE_ADDRESS)

          - task: PublishTestResults@2
            displayName: Publish BDD test results
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: opsledger-test-results\**\*.trx
              searchFolder: $(Agent.TempDirectory)
              failTaskOnFailedTests: false
              testRunTitle: OpsLedger BDD validation

          - pwsh: |
              [string]$pipelineRunUrl = "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
              [string]$configuredWorkItemType = "$(ADO_WORK_ITEM_TYPE)"

              if ([string]::IsNullOrWhiteSpace($configuredWorkItemType) -or $configuredWorkItemType.StartsWith("$(")) {
                $configuredWorkItemType = "Issue"
              }

              [hashtable]$workItemArguments = @{
                OrganizationUrl = "$(System.CollectionUri)"
                Project = "$(System.TeamProject)"
                ResultsRoot = "$(OPSLEDGER_TEST_RESULTS_ROOT)"
                Repository = "$(GITHUB_REPOSITORY)"
                CommitSha = "$(GITHUB_COMMIT_SHA)"
                GithubRunUrl = "$(GITHUB_RUN_URL)"
                ArtifactName = "$(GITHUB_ARTIFACT_NAME)"
                PipelineRunUrl = $pipelineRunUrl
                WorkItemType = $configuredWorkItemType
              }

              ./scripts/create-ado-work-item.ps1 @workItemArguments
            displayName: Create or update failed BDD work items
            condition: always()
            continueOnError: true
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              ADO_WORK_ITEM_DEDUPE_SALT: $(ADO_WORK_ITEM_DEDUPE_SALT)

          - pwsh: ./scripts/stop-test-env.ps1
            displayName: Stop validation environment
            condition: always()
            env:
              OPSLEDGER_API_PROCESS_ID: $(OPSLEDGER_API_PROCESS_ID)

          - publish: $(OPSLEDGER_TEST_RESULTS_ROOT)
            displayName: Publish BDD result artifacts
            condition: always()
            artifact: opsledger-bdd-results

          - publish: $(Pipeline.Workspace)\opsledger-logs
            displayName: Publish validation logs
            condition: always()
            artifact: opsledger-validation-logs
