name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TEST_RESULTS_DIR: artifacts/test-results
  COVERAGE_REPORT_DIR: artifacts/coverage-report
  REPORTGENERATOR_DIR: artifacts/tools/reportgenerator
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  validate:
    name: Restore, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend and test projects
        run: |
          dotnet restore src/OpsLedger.Api/OpsLedger.Api.csproj
          dotnet restore src/OpsLedger.Presentation/OpsLedger.Presentation.csproj
          dotnet restore tests/OpsLedger.UnitTests/OpsLedger.UnitTests.csproj
          dotnet restore tests/OpsLedger.IntegrationTests/OpsLedger.IntegrationTests.csproj
          dotnet restore tests/OpsLedger.BddTests/OpsLedger.BddTests.csproj

      - name: Build backend and presentation projects
        run: |
          dotnet build src/OpsLedger.Api/OpsLedger.Api.csproj --configuration Release --no-restore
          dotnet build src/OpsLedger.Presentation/OpsLedger.Presentation.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test tests/OpsLedger.UnitTests/OpsLedger.UnitTests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=OpsLedger.UnitTests.trx"
          --results-directory "${{ env.TEST_RESULTS_DIR }}/unit"
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/*.cs,**/*.Designer.cs,**/Platforms/**/*.cs,**/obj/**/*.cs"
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*.Tests]*"

      - name: Run API integration tests
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          OPSLEDGER_STORAGE_PROVIDER: InMemory
        run: >
          dotnet test tests/OpsLedger.IntegrationTests/OpsLedger.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=OpsLedger.IntegrationTests.trx"
          --results-directory "${{ env.TEST_RESULTS_DIR }}/integration"
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/*.cs,**/*.Designer.cs,**/Platforms/**/*.cs,**/obj/**/*.cs"
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*.Tests]*"

      - name: Run API BDD scenarios
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          OPSLEDGER_STORAGE_PROVIDER: InMemory
          OPSLEDGER_RUN_UI_BDD: "false"
        run: >
          dotnet test tests/OpsLedger.BddTests/OpsLedger.BddTests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=OpsLedger.BddTests.trx"
          --results-directory "${{ env.TEST_RESULTS_DIR }}/bdd"
          --filter "Category!=ui"

      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: .NET test results
          path: ${{ env.TEST_RESULTS_DIR }}/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Install ReportGenerator
        if: ${{ always() && hashFiles('artifacts/test-results/**/coverage.cobertura.xml') != '' }}
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path "${{ env.REPORTGENERATOR_DIR }}"

      - name: Generate coverage report
        if: ${{ always() && hashFiles('artifacts/test-results/**/coverage.cobertura.xml') != '' }}
        run: >
          "${{ env.REPORTGENERATOR_DIR }}/reportgenerator"
          -reports:"${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml"
          -targetdir:"${{ env.COVERAGE_REPORT_DIR }}"
          -reporttypes:"HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"
          -assemblyfilters:"+OpsLedger.*;-*.Tests"
          -classfilters:"-*.Migrations.*"
          -filefilters:"-**/Migrations/*.cs;-**/*.Designer.cs;-**/Platforms/**/*.cs;-**/obj/**/*.cs"

      - name: Append coverage summary
        if: ${{ always() && hashFiles('artifacts/coverage-report/SummaryGithub.md') != '' }}
        run: cat "${{ env.COVERAGE_REPORT_DIR }}/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test result artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opsledger-test-results
          path: ${{ env.TEST_RESULTS_DIR }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('artifacts/coverage-report/**') != '' }}
        with:
          name: opsledger-coverage-report
          path: ${{ env.COVERAGE_REPORT_DIR }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  publish-windows-artifact:
    name: Publish win-x64 MAUI artifact
    runs-on: windows-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET local tools
        shell: pwsh
        run: dotnet tool restore

      - name: Restore MAUI workloads
        shell: pwsh
        run: dotnet workload restore src/OpsLedger.App/OpsLedger.App.csproj

      - name: Restore app project
        shell: pwsh
        run: dotnet restore src/OpsLedger.App/OpsLedger.App.csproj

      - name: Publish Windows artifact
        shell: pwsh
        run: >
          ./scripts/Publish-OpsLedgerApp.ps1
          -Target win-x64
          -Configuration Release
          -CommitSha "${{ github.sha }}"
          -NoRestore

      - name: Resolve artifact path
        id: artifact
        shell: pwsh
        run: |
          $artifactDirectory = Get-ChildItem -Directory artifacts/opsledger-app-win-x64-* | Select-Object -First 1
          if ($null -eq $artifactDirectory) {
              throw "Windows artifact directory was not created."
          }

          "path=$($artifactDirectory.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($artifactDirectory.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Trigger Azure DevOps validation
        shell: pwsh
        env:
          AZDO_INCOMING_WEBHOOK_URL: ${{ secrets.AZDO_INCOMING_WEBHOOK_URL }}
          AZDO_INCOMING_WEBHOOK_SECRET: ${{ secrets.AZDO_INCOMING_WEBHOOK_SECRET }}
          OPSLEDGER_ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: >
          ./scripts/Send-AzureDevOpsValidationTrigger.ps1
          -WebhookUrl $env:AZDO_INCOMING_WEBHOOK_URL
          -WebhookSecret $env:AZDO_INCOMING_WEBHOOK_SECRET
          -Repository "${{ github.repository }}"
          -Branch "${{ github.ref_name }}"
          -CommitSha "${{ github.sha }}"
          -GithubRunId "${{ github.run_id }}"
          -GithubRunAttempt "${{ github.run_attempt }}"
          -GithubRunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          -ArtifactName $env:OPSLEDGER_ARTIFACT_NAME
