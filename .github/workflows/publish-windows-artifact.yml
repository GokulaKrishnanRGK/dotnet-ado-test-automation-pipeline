name: Publish Windows Artifact

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration.
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

jobs:
  publish-windows-artifact:
    name: Publish win-x64 MAUI artifact
    runs-on: windows-latest
    env:
      ARTIFACT_RETENTION_DAYS: 14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET local tools
        shell: pwsh
        run: dotnet tool restore

      - name: Restore MAUI workloads
        shell: pwsh
        run: dotnet workload restore src/OpsLedger.App/OpsLedger.App.csproj

      - name: Publish Windows artifact
        shell: pwsh
        run: |
          [hashtable]$publishArguments = @{
            Target = "win-x64"
            Configuration = "${{ inputs.configuration }}"
            CommitSha = "${{ github.sha }}"
          }

          ./scripts/Publish-OpsLedgerApp.ps1 @publishArguments

      - name: Validate Windows artifact metadata
        shell: pwsh
        run: |
          [System.IO.DirectoryInfo]$artifactDirectory = Get-ChildItem -Directory artifacts/opsledger-app-win-x64-* | Select-Object -First 1

          if ($null -eq $artifactDirectory) {
            throw "Windows artifact directory was not created."
          }

          [hashtable]$testArguments = @{
            ArtifactPath = $artifactDirectory.FullName
          }

          ./scripts/Test-OpsLedgerArtifact.ps1 @testArguments

      - name: Resolve artifact path
        id: artifact
        shell: pwsh
        run: |
          $artifactDirectory = Get-ChildItem -Directory artifacts/opsledger-app-win-x64-* | Select-Object -First 1
          if ($null -eq $artifactDirectory) {
              throw "Windows artifact directory was not created."
          }

          "path=$($artifactDirectory.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($artifactDirectory.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
