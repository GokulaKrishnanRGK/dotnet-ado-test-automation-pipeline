name: Publish Windows Artifact

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration.
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

jobs:
  publish-windows-artifact:
    name: Publish win-x64 MAUI artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET local tools
        shell: pwsh
        run: dotnet tool restore

      - name: Restore MAUI workloads
        shell: pwsh
        run: dotnet workload restore src/OpsLedger.App/OpsLedger.App.csproj

      - name: Restore solution
        shell: pwsh
        run: dotnet restore OpsLedger.slnx

      - name: Publish Windows artifact
        shell: pwsh
        run: >
          ./scripts/Publish-OpsLedgerApp.ps1
          -Target win-x64
          -Configuration "${{ inputs.configuration }}"
          -CommitSha "${{ github.sha }}"
          -NoRestore

      - name: Validate Windows artifact metadata
        shell: pwsh
        run: >
          ./scripts/Test-OpsLedgerArtifact.ps1
          -ArtifactPath (Get-ChildItem -Directory artifacts/opsledger-app-win-x64-* | Select-Object -First 1).FullName

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsledger-app-win-x64-${{ github.sha }}
          path: artifacts/opsledger-app-win-x64-*
          if-no-files-found: error
