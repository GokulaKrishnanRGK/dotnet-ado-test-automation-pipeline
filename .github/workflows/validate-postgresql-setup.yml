name: Validate PostgreSQL Setup

on:
  workflow_dispatch:
  push:
    branches:
      - dev/manual_pipeline_trigger

permissions:
  contents: read

jobs:
  validate-postgresql-setup:
    name: Validate PostgreSQL setup script
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PostgreSQL setup script
        shell: pwsh
        run: ./scripts/install-postgresql.ps1
